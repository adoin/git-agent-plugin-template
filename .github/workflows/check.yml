name: Plugin checks and packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check-release.py "${{ github.ref_name }}"
      - run: python scripts/plugin.py package --target ${{ matrix.target }}
      - name: Keep root plugin release assets separate from the fixture
        run: python scripts/release_plugin.py stage
      - run: python scripts/plugin.py package --example minimal --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: |
            dist/**/*.gaplugin
            dist/**/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish configured plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_plugin.py publish "${{ github.ref_name }}"
