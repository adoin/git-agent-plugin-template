[package]
name = "git-agent-plugin-github"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[lib]
name = "git_agent_plugin_github"
crate-type = ["cdylib", "rlib"]

[dependencies]
git-agent-plugin-sdk = { path = "vendor/git-agent-plugin-sdk", version = "=0.1.0" }
serde_json = "1"

[workspace]
members = ["vendor/git-agent-plugin-sdk", "examples/minimal"]
default-members = ["."]
resolver = "2"
